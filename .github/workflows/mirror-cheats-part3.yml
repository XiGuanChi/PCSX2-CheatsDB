name: Mirror Cheats (xGamingDragon93x)

on:
  workflow_dispatch:   # Allows manual triggering from the Actions tab

jobs:
  update-cheats:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to push to the repository

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get .rar asset URL from the latest source release
        id: get_asset
        run: |
          RELEASE_API="https://api.github.com/repos/xGamingDragon93x/PCSX2-Ultimative-Cheats-Collection-PNACH/releases/latest"
          ASSET_URL=$(curl -s $RELEASE_API | jq -r '.assets[] | select(.name | endswith(".rar")) | .browser_download_url')
          if [ -z "$ASSET_URL" ]; then
            echo "No .rar file found in the latest release!"
            exit 1
          fi
          echo "asset_url=$ASSET_URL" >> $GITHUB_OUTPUT

      - name: Download the .rar file
        run: |
          curl -L -o cheats.rar "${{ steps.get_asset.outputs.asset_url }}"

      - name: Install unrar
        run: sudo apt-get update && sudo apt-get install -y unrar

      - name: Extract .rar to a temporary folder
        run: |
          mkdir extracted
          unrar x cheats.rar extracted/

      - name: Clean cheats-v6 folder and copy only .pnach files
        run: |
          rm -rf cheats-v6
          mkdir -p cheats-v6
          find extracted -type f -name "*.pnach" -exec cp {} cheats-v6/ \;

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cheats-v6/
          git commit -m "Update cheats from upstream $(date -u +'%Y-%m-%d')" || echo "No new changes"
          git push
