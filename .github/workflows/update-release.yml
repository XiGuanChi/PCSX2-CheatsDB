name: Check and Update Folder List

on:
  workflow_dispatch:         # Allow manual trigger

jobs:
  update-folders:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Required for commit & push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate folder list
        id: generate
        run: |
          # Initialize folder array
          folders=()

          # Static folders
          folders+=("PCSX2 Patches")

          # Auto‑detect cheats‑v* folders (sorted by version)
          while IFS= read -r dir; do
            folders+=("$dir")
          done < <(find . -maxdepth 1 -type d -name "cheats-v*" -printf "%f\n" | sort -V)

          # Auto‑detect patches‑v* folders (sorted by version)
          while IFS= read -r dir; do
            folders+=("$dir")
          done < <(find . -maxdepth 1 -type d -name "patches-v*" -printf "%f\n" | sort -V)

          # Static folder
          folders+=("patches-team")

          # Build folder list string: "folder1" "folder2" ...
          list=""
          for f in "${folders[@]}"; do
            list="$list \"$f\""
          done
          list="${list# }"   # Remove leading space

          echo "FOLDER_LIST=$list" >> $GITHUB_ENV
          echo "Generated folder list: $list"

      - name: Update release-ultra-plus.yml
        run: |
          perl -pi -e 's/for folder in .*?;/for folder in $ENV{FOLDER_LIST};/' \
            .github/workflows/release-ultra-plus.yml

      - name: Update release-ultra.yml
        run: |
          perl -pi -e 's/for folder in .*?;/for folder in $ENV{FOLDER_LIST};/' \
            .github/workflows/release-ultra.yml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release-ultra-plus.yml .github/workflows/release-ultra.yml
          git diff --staged --quiet || git commit -m "chore: update folder list in release workflows"
          git push
