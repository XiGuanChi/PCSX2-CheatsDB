name: Check and Update Workflows

on:
  workflow_dispatch:             # Can also be triggered manually

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # Required to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install yq (YAML processor)
        uses: mikefarah/yq@v4.44.3

      - name: Get list of folders from cheats
        run: |
          # List all subdirectories inside cheats, excluding the directory itself
          find cheats -maxdepth 1 -type d -not -name "." -exec basename {} \; | sort > folder_list.txt
          echo "FOLDER_LIST=folder_list.txt" >> $GITHUB_ENV

      - name: Update release-ultra-plus.yml
        run: |
          FILE=".github/workflows/release-ultra-plus.yml"
          PATH=".jobs.ultra-plus.strategy.matrix.folder"   # Adjust if your YAML structure differs

          # Read the current array
          CURRENT=$(yq eval "$PATH" "$FILE")
          if [ "$CURRENT" = "null" ]; then
            yq eval "$PATH = []" -i "$FILE"
            CURRENT="[]"
          fi

          # Add folders that are not yet present
          while IFS= read -r folder; do
            if [ -n "$folder" ] && ! echo "$CURRENT" | grep -q "\"$folder\""; then
              yq eval "$PATH += [\"$folder\"]" -i "$FILE"
              echo "Added $folder to $FILE"
            fi
          done < "${{ env.FOLDER_LIST }}"

      - name: Update release-ultra.yml
        run: |
          FILE=".github/workflows/release-ultra.yml"
          PATH=".jobs.ultra.strategy.matrix.folder"         # Adjust if your YAML structure differs

          CURRENT=$(yq eval "$PATH" "$FILE")
          if [ "$CURRENT" = "null" ]; then
            yq eval "$PATH = []" -i "$FILE"
            CURRENT="[]"
          fi

          while IFS= read -r folder; do
            if [ -n "$folder" ] && ! echo "$CURRENT" | grep -q "\"$folder\""; then
              yq eval "$PATH += [\"$folder\"]" -i "$FILE"
              echo "Added $folder to $FILE"
            fi
          done < "${{ env.FOLDER_LIST }}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release-ultra-plus.yml .github/workflows/release-ultra.yml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update folder list in release workflows"
            git push
          fi
