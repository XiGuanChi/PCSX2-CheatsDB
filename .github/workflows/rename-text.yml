name: Rename Text in .pnach Files

on:
  workflow_dispatch:   # allows manual trigger

permissions:
  contents: write      # needed to commit and push changes

jobs:
  rename:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run rename script
        run: python .github/scripts/rename_pnach.py

      - name: Commit and push if changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: replace //Name with [Name] in .pnach files"
            git push
          else
            echo "No changes to commit."
          fi
