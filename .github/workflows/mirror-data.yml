name: Mirror Repository

on:
  workflow_dispatch:  # Allow manual trigger

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: XDiaoXuanX/PCSX2-CheatDB
          ref: main
          fetch-depth: 0               # Get full history
          token: ${{ secrets.GITHUB_TOKEN }}  # Default token (read-only for public repos)

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push to destination repository
        env:
          DEST_TOKEN: ${{ secrets.DESTINATION_TOKEN }}
        run: |
          # Force-push the 'main' branch from source to 'Master' branch in destination
          git push --force https://x-access-token:${DEST_TOKEN}@github.com/XiGuanChi/PCSX2-CheatsDB.git main:Master

          # (Optional) Uncomment to also push tags:
          # git push --tags --force https://x-access-token:${DEST_TOKEN}@github.com/XiGuanChi/PCSX2-CheatsDB.git
