name: Mirror BIOS PS2 files from  RetroPieBIOS

on:
  workflow_dispatch:          # Manual trigger only

permissions:
  contents: write             # Required to push to the destination repo

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: archtaurus/RetroPieBIOS
          ref: master
          path: source_repo
          fetch-depth: 1

      - name: Checkout target repository 
        uses: actions/checkout@v4
        with:
          repository: XiGuanChi/PCSX2-CheatsDB
          ref: main
          path: target_repo
          fetch-depth: 1

      - name: Sync only specific BIOS files into Retro-Database/bios/PS1
        run: |
          # Remove any existing Retro-Database/bios/PS2 folder in the target
          rm -rf target_repo/Retro-Database/bios/PS2
          mkdir -p target_repo/Retro-Database/bios/PS2

          # Check if the source has a 'BIOS/pcsx2/bios' folder
          if [ -d "source_repo/BIOS/pcsx2/bios/" ]; then
            # Use rsync with inclusion filters for the allowed extensions.
            # The --delete flag ensures the target contains exactly these files
            # (any extra files in target will be removed).
            rsync -av --delete \
              --include='*.bin'   \
              --include='*.BIN'   \
              --include='*.ROM'   \
              --include='*.ROM0'  \
              --include='*.ROM1'  \
              --include='*.EROM'  \
              --include='*.MEC'   \
              --exclude='*'       \
              source_repo/BIOS/pcsx2/bios/ target_repo/Retro-Database/bios/PS2/
          else
            echo "Warning: 'BIOS/pcsx2/bios' folder not found in source_repo. Nothing copied."
          fi

          # Safety: remove any accidental .git folder that might have been copied
          rm -rf target_repo/Retro-Database/bios/PS2/.git

      - name: Commit and push changes if any
        run: |
          cd target_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Retro-Database/bios/PS2

          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Sync specific BIOS files from RetroPieBIOS (commit ${{ github.sha }})"
            git push origin main
          fi
