name: Mirror Patches (Bulk)

on:
  workflow_dispatch:   # Allow manual triggering

permissions:
  contents: write     # Required to push to the destination repository

jobs:
  mirror-v1:
    name: Mirror TheAdmiester
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: TheAdmiester/PCSX2-Cheats
          ref: main
          path: source_repo
          fetch-depth: 1

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: XiGuanChi/PCSX2-CheatsDB
          ref: main
          path: target_repo
          fetch-depth: 1

      - name: Sync only .pnach files into patches-v1 folder
        run: |
          mkdir -p target_repo/patches-v1
          rsync -av --delete \
            --exclude='.git' \
            --include='*/' \
            --include='*.pnach' \
            --exclude='*' \
            source_repo/ target_repo/patches-v1/
          rm -rf target_repo/patches-v1/.git

      - name: Commit and push if changes exist
        run: |
          cd target_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches-v1
          if git diff --cached --quiet; then
            echo "No changes detected in .pnach files. Skipping commit."
          else
            git commit -m "Sync .pnach files from PCSX2-Cheats (commit ${{ github.sha }})"
            git push origin main
          fi

