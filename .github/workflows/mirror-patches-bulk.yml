name: Mirror Patches (Bulk)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror-v1:
    name: Mirror TheAdmiester
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: TheAdmiester/PCSX2-Cheats
          ref: main
          path: source_repo
          fetch-depth: 1

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: XiGuanChi/PCSX2-CheatsDB
          ref: main
          path: target_repo
          fetch-depth: 1

      - name: Sync .pnach to patches-v1
        run: |
          mkdir -p target_repo/patches-v1
          rsync -av --delete \
            --exclude='.git' \
            --include='*/' \
            --include='*.pnach' \
            --exclude='*' \
            source_repo/ target_repo/patches-v1/
          rm -rf target_repo/patches-v1/.git

      - name: Commit and push
        run: |
          cd target_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches-v1
          if git diff --cached --quiet; then
            echo "No changes. Skipping commit."
          else
            git commit -m "Sync .pnach from PCSX2-Cheats (commit ${{ github.sha }})"
            git push origin main
          fi

      - name: Delay 30 seconds before next job
        run: sleep 30

  mirror-v2:
    name: Mirror PCSX2 (pcsx2_patches)
