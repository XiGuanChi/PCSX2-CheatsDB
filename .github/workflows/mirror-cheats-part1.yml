name: Mirror Cheats (igorciz777)

on:
  workflow_dispatch:   # Allow manual triggering

permissions:
  contents: write     # Required to push to the destination repository

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: igorciz777/Misc-PCSX2-Cheats
          ref: main
          path: source_repo
          fetch-depth: 1

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: XiGuanChi/PCSX2-CheatsDB
          ref: main
          path: target_repo
          fetch-depth: 1

      - name: Sync patches into cheats-v3 folder
        run: |
          # Remove old cheats-v3 folder (but keep the .git directory of the target repo)
          rm -rf target_repo/cheats-v3
          mkdir -p target_repo/cheats-v3

          # Copy all contents (except .git) from source to cheats-v3
          # rsync -a: archive mode, -v: verbose, --delete: remove files in dest that are not in source
          rsync -av --delete --exclude='.git' source_repo/ target_repo/cheats-v3/

          # Remove any stray .git folder that might have been copied
          rm -rf target_repo/cheats-v3/.git

      - name: Commit and push if changes exist
        run: |
          cd target_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add cheats-v3

          # Check if there are any changes staged for commit
          if git diff --cached --quiet; then
            echo "No changes detected in patches. Skipping commit."
          else
            git commit -m "Sync patches from Misc-PCSX2-Cheats (commit ${{ github.sha }})"
            git push origin master
          fi
