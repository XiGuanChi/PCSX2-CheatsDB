name: Rename Text

on:
  workflow_dispatch:   # manual trigger from Actions tab

jobs:
  replace-text:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace //Name with [Name] in .pnach files
        run: |
          # Find all .pnach files in cheats-v1 through cheats-v6
          find cheats-v1 cheats-v2 cheats-v3 cheats-v4 cheats-v5 cheats-v6 \
            -type f -name "*.pnach" -exec sed -i 's|//Name|[Name]|g' {} \;

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cheats-v*/.
          # Only commit if there are staged changes
          git diff --staged --quiet || git commit -m "Replace //Name with [Name] in .pnach files"
          git push
